general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  # NOTE: the field is `action`, NOT `state`. An unrecognized field silently
  # falls back to TOGGLE_ACTION_TOGGLE (enum value 0), which inverts each
  # monitor rather than turning it on — so `state = "on"` blanked whichever
  # displays were already awake. See turn-off-monitors-with-checks.sh.
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
  timeout = 300
  on-timeout = ~/.config/hypr/scripts/lock_with_checks.sh
}

listener {
  timeout = 330
  on-timeout = ~/.config/hypr/scripts/turn-off-monitors-with-checks.sh
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
